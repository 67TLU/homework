<div class="space-y-6">
  <div class="flex flex-col @sm:flex-row @sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-card-border shadow-sm">
    <div>
      <h2 class="font-serif text-2xl font-bold text-ink">Quản lý dịch vụ</h2>
      <p class="text-xs text-ink/60 mt-0.5">12 dịch vụ · 10 đang mở · 2 tạm ngưng</p>
    </div>

    <div class="flex items-center gap-3">
      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-ink/40 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" placeholder="Tìm dịch vụ..." class="pl-8 pr-3 py-1.5 text-xs bg-paper rounded-lg border border-card-border focus:outline-none focus:border-sage text-ink" />
      </div>
      <button onclick="App.openAdminServiceModal()" class="px-4 py-2 bg-sage hover:bg-sage-deep text-white text-xs font-semibold rounded-xl shadow-xs transition-colors flex items-center gap-1.5">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i> + Thêm dịch vụ
      </button>
    </div>
  </div>

  <div class="bg-white rounded-3xl border border-card-border shadow-sm overflow-hidden">
    <table class="w-full text-left text-xs">
      <thead class="bg-paper text-ink/60 uppercase font-bold text-[10px] tracking-wider border-b border-card-border">
        <tr>
          <th class="py-3 px-4">DỊCH VỤ</th>
          <th class="py-3 px-4">DANH MỤC</th>
          <th class="py-3 px-4">THỜI LƯỢNG</th>
          <th class="py-3 px-4">TRẠNG THÁI</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-card-border">
        <tr>
          <td class="py-3 px-4 font-bold text-ink">Tư vấn cá nhân 1-1</td>
          <td class="py-3 px-4 text-ink/70">Tư vấn cá nhân</td>
          <td class="py-3 px-4 font-mono text-ink/70">45 phút</td>
          <td class="py-3 px-4"><span class="status-pill status-confirmed"><span class="status-dot"></span><span>Hoạt động</span></span></td>
        </tr>
        <tr>
          <td class="py-3 px-4 font-bold text-ink">Workshop quản trị cảm xúc</td>
          <td class="py-3 px-4 text-ink/70">Workshop nhóm</td>
          <td class="py-3 px-4 font-mono text-ink/70">90 phút</td>
          <td class="py-3 px-4"><span class="status-pill status-pending"><span class="status-dot"></span><span>Sắp khai giảng</span></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
