<div class="max-w-4xl mx-auto space-y-8">
  <div class="text-center space-y-1">
    <span class="text-xs uppercase font-bold tracking-wider text-sage">LUỒNG ĐẶT LỊCH HỖ TRỢ</span>
    <h2 class="font-serif text-3xl font-bold text-ink">Bốn bước, không ngõ cụt</h2>
    <p class="text-xs text-ink/60">Wizard có thanh tiến độ, kiểm tra hợp lệ tại chỗ và tóm tắt rõ ràng</p>
  </div>

  <div class="bg-white p-4 rounded-2xl border border-card-border shadow-xs flex items-center justify-between text-xs font-semibold">
    <div class="flex items-center gap-2 text-sage"><span class="w-6 h-6 rounded-full bg-sage text-white flex items-center justify-center text-[11px]">✓</span><span class="hidden @sm:inline">1. Chọn dịch vụ</span></div>
    <div class="h-0.5 flex-1 bg-sage mx-3"></div>
    <div class="flex items-center gap-2 text-sage"><span class="w-6 h-6 rounded-full bg-sage text-white flex items-center justify-center text-[11px]">✓</span><span class="hidden @sm:inline">2. Chọn khung giờ</span></div>
    <div class="h-0.5 flex-1 bg-sage mx-3"></div>
    <div class="flex items-center gap-2 text-ink"><span class="w-6 h-6 rounded-full bg-ink text-white flex items-center justify-center text-[11px]">3</span><span class="font-bold">3. Thông tin buổi tư vấn</span></div>
  </div>

  <div class="bg-white rounded-3xl p-6 border border-card-border shadow-sm">
    <form class="space-y-5 text-xs">
      <div>
        <label class="block font-medium text-ink mb-1">Họ và tên</label>
        <input type="text" value="Lê Ngọc An" class="w-full px-3.5 py-2.5 bg-paper rounded-xl border border-card-border focus:outline-none focus:border-sage text-ink text-xs" />
      </div>
      <div>
        <label class="block font-medium text-ink mb-1">Email sinh viên</label>
        <input type="text" value="ngocan@student.edu.vn" class="w-full px-3.5 py-2.5 bg-paper rounded-xl border border-card-border focus:outline-none focus:border-sage text-ink text-xs font-mono" />
      </div>
      <div>
        <label class="block font-medium text-ink mb-1">Chủ đề muốn trao đổi</label>
        <input type="text" value="Áp lực học tập & thi cử" class="w-full px-3.5 py-2.5 bg-paper rounded-xl border border-card-border focus:outline-none focus:border-sage text-ink text-xs" />
      </div>
      <div>
        <label class="block font-medium text-ink mb-1">Mô tả ngắn</label>
        <textarea rows="3" class="w-full px-3.5 py-2.5 bg-paper rounded-xl border border-card-border focus:outline-none focus:border-sage text-ink text-xs leading-relaxed">Dạo này mình thấy quá tải với lịch thi cuối kỳ...</textarea>
      </div>
      <div class="pt-4 border-t border-card-border flex items-center justify-between">
        <button onclick="App.navigateTo('services')" type="button" class="px-4 py-2 border border-card-border rounded-xl text-ink font-medium hover:bg-paper">← Quay lại</button>
        <button onclick="App.submitBooking()" type="button" class="px-6 py-2.5 bg-sage hover:bg-sage-deep text-white font-bold rounded-xl shadow transition-colors flex items-center gap-1.5">
          <span>Tiếp tục (Xác nhận)</span><i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </form>
  </div>
</div>
